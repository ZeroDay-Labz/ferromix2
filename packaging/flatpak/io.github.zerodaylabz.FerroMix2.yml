# Flatpak manifest for FerroMix2.
#
# NOTE for maintainers: this manifest is new and, unlike the RPM/tar.gz
# packaging, has not yet produced a working *bundle* end-to-end (untested on
# real hardware) — but as of the v3.1.0-alpha.1 CI run it does build and
# finish cleanly (module builds, appstream compose, and `flatpak
# build-finish` all succeeded; see git blame on the
# `--filesystem=xdg-run/pipewire-0` line for the bug that blocked
# build-finish for four releases). If it breaks again the two next most
# likely spots are the `pipewire` module's meson `config-opts` (option names/
# defaults drift between PipeWire releases) and the pinned `tag:` below going
# stale. Check the Actions log and adjust those two spots first.
#
# Why FerroMix2 builds its own PipeWire instead of using the runtime's: the
# freedesktop runtime ships PipeWire's *shared libraries* (for portal/screen-
# share use by other apps) but not its *development* headers/pkgconfig files,
# which `mixer-pw`'s bindgen-based bindings need at compile time. Building a
# minimal client-only PipeWire here (no ALSA/PulseAudio/JACK compat, no
# session manager, no server-side extras) gives us those headers without
# depending on undocumented runtime internals. At *runtime* the sandboxed app
# still talks to the HOST's already-running PipeWire server by way of the
# `xdg-run/pipewire-0` filesystem grant below — it never starts a server of
# its own.
id: io.github.zerodaylabz.FerroMix2
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # bindgen (pulled in by mixer-pw's pipewire-sys/libspa-sys) needs libclang
  # at build time, which the base Sdk does NOT ship — confirmed live:
  # "Unable to find libclang" even though the Sdk's own gcc/clang *compiler*
  # driver is present (that's a different thing from bindgen's libclang.so
  # backend). This extension provides it.
  - org.freedesktop.Sdk.Extension.llvm20
command: ferromix2

finish-args:
  # Window display (Wayland native, X11 fallback for non-Wayland sessions).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU access for iced's wgpu renderer.
  - --device=dri
  # The actual audio graph — talks to the HOST's PipeWire server. There is
  # no such thing as `--socket=pipewire`: that was tried first and fails on
  # every flatpak version, including 1.16.6 (confirmed live — the error
  # message itself enumerates the valid socket types and "pipewire" has
  # never been one of them; upgrading flatpak via the PPA below didn't fix
  # it because it was never a stale-version problem). PipeWire access is
  # instead granted the same way OBS Studio/EasyEffects do it on Flathub:
  # expose the actual socket file the client library connects to.
  - --filesystem=xdg-run/pipewire-0
  # RESET AUDIO / sample-rate change restart PipeWire+WirePlumber via
  # `systemctl --user` on the host; `mixer_core::engine::host_command`
  # detects the sandbox and routes this through `flatpak-spawn --host`,
  # which needs this permission.
  - --talk-name=org.freedesktop.Flatpak
  # So bus/strip recordings can land somewhere the user can actually find
  # them (see `Config.recordings_dir`'s default: `dirs::audio_dir()`).
  - --filesystem=xdg-music:create

modules:
  - name: pipewire
    buildsystem: meson
    config-opts:
      # Confirmed against a real build (pipewire 1.2.7's meson_options.txt):
      # `installed-tests` and `pipewire-pulseaudio` are NOT valid option
      # names for this release (meson fails fast, listing exactly which ones
      # it doesn't recognize, which is how these two got caught) — pulseaudio
      # compat is controlled by `-Dpipewire-alsa`/session modules, not a
      # separate option, and there's no installed-tests toggle at all.
      - -Dsession-managers=[]
      - -Dpipewire-alsa=disabled
      - -Dpipewire-v4l2=disabled
      - -Dpipewire-jack=disabled
      - -Dgstreamer=disabled
      - -Dgstreamer-device-provider=disabled
      - -Dffmpeg=disabled
      - -Dbluez5=disabled
      - -Davahi=disabled
      - -Dvulkan=disabled
      - -Dsdl2=disabled
      - -Ddocs=disabled
      - -Dman=disabled
      - -Dtests=disabled
      - -Dexamples=disabled
      - -Dsystemd=disabled
      - -Dsystemd-system-service=disabled
      - -Dsystemd-user-service=disabled
      - -Dselinux=disabled
      # `-Dpipewire-alsa` (above) is the ALSA *client* integration
      # (libasound plugin so ALSA-only apps can play through PipeWire) — it's
      # a different option from `alsa`, the SPA plugin that lets PipeWire
      # *talk to real ALSA hardware*, which we don't need (we're a client of
      # the host's already-running PipeWire server, never a server driving
      # hardware ourselves) and whose udev rule install tried to write
      # outside /app: `OSError: [Errno 30] Read-only file system:
      # '/usr/lib/udev'`, confirmed live. `udevrulesdir` is set too as a
      # fallback in case any other enabled component ever tries the same.
      - -Dalsa=disabled
      - -Dudevrulesdir=/app/lib/udev/rules.d
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/pipewire/pipewire.git
        # Bump periodically — pinned so builds are reproducible rather than
        # silently picking up whatever `master` happens to be.
        tag: 1.2.7

  - name: ferromix2
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
      build-args:
        # Not vendoring a cargo-sources.json for an offline build (the
        # Flathub-required approach) since this isn't submitted to Flathub —
        # it's a self-hosted bundle, so a plain networked `cargo build`
        # against crates.io is simpler and one less generated file to keep in
        # sync with Cargo.lock. Revisit if this ever does go to Flathub.
        - --share=network
    build-commands:
      - cargo build --release -p mixer-gui-iced
      - install -Dm755 target/release/ferromix2 /app/bin/ferromix2
      - install -Dm644 packaging/flatpak/io.github.zerodaylabz.FerroMix2.desktop
        /app/share/applications/io.github.zerodaylabz.FerroMix2.desktop
      - install -Dm644 assets/ferromix2.svg
        /app/share/icons/hicolor/scalable/apps/io.github.zerodaylabz.FerroMix2.svg
      - install -Dm644 packaging/flatpak/io.github.zerodaylabz.FerroMix2.metainfo.xml
        /app/share/metainfo/io.github.zerodaylabz.FerroMix2.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - .idea
          - ferromix_dump.txt
